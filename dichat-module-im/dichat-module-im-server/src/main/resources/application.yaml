spring:
  application:
    name: im-server

  profiles:
    active: local

  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。
    allow-bean-definition-overriding: true # 允许 Bean 覆盖，例如说 Feign 等会存在重复定义的服务

  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml # 加载【本地】配置
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml # 加载【Nacos】的配置

  # Servlet 配置
  servlet:
    # 文件上传相关配置项
    multipart:
      max-file-size: 16MB # 单个文件大小
      max-request-size: 32MB # 设置总上传的文件大小

  # Jackson 配置项
  jackson:
    serialization:
      write-dates-as-timestamps: true # 设置 LocalDateTime 的格式，使用时间戳
      write-date-timestamps-as-nanoseconds: false # 设置不使用 nanoseconds 的格式。例如说 1611460870.401，而是直接 1611460870401
      write-durations-as-timestamps: true # 设置 Duration 的格式，使用时间戳
      fail-on-empty-beans: false # 允许序列化无属性的 Bean

  # Cache 配置项
  cache:
    type: REDIS
    redis:
      time-to-live: 1h # 设置过期时间为 1 小时

server:
  port: 10014

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log # 日志文件名，全路径

--- #################### 接口文档配置 ####################

springdoc:
  api-docs:
    enabled: true # 1. 是否开启 Swagger 接文档的元数据
    path: /v3/api-docs
  swagger-ui:
    enabled: true # 2.1 是否开启 Swagger 文档的官方 UI 界面
    path: /swagger-ui
  default-flat-param-object: true # 参见 https://doc.xiaominfo.com/docs/faq/v4/knife4j-parameterobject-flat-param 文档

knife4j:
  enable: true
  setting:
    language: zh_cn

# MyBatis Plus 的配置项
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 虽然默认为 true ，但是还是显示去指定下。
  global-config:
    db-config:
      id-type: NONE # “智能”模式，基于 IdTypeEnvironmentPostProcessor + 数据源的类型，自动适配成 AUTO、INPUT 模式。
      #      id-type: AUTO # 自增 ID，适合 MySQL 等直接自增的数据库
      #      id-type: INPUT # 用户输入 ID，适合 Oracle、PostgreSQL、Kingbase、DB2、H2 数据库
      #      id-type: ASSIGN_ID # 分配 ID，默认使用雪花算法。注意，Oracle、PostgreSQL、Kingbase、DB2、H2 数据库时，需要去除实体类上的 @KeySequence 注解
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
    banner: false # 关闭控制台的 Banner 打印
  type-aliases-package: ${dichat.info.base-package}.dal.dataobject
  encryptor:
    password: CHANGE_ME # 加解密的秘钥，可使用 https://www.imaegoo.com/2020/aes-key-generator/ 网站生成

mybatis-plus-join:
  banner: false # 关闭控制台的 Banner 打印

# Spring Data Redis 配置
spring:
  data:
    redis:
      repositories:
        enabled: false # 项目未使用到 Spring Data Redis 的 Repository，所以直接禁用，保证启动速度

# VO 转换（数据翻译）相关
easy-trans:
  is-enable-global: false # 【默认禁用，对性能确认压力大】启用全局翻译（拦截所有 SpringMVC ResponseBody 进行自动翻译 )。如果对于性能要求很高可关闭此配置，或通过 @IgnoreTrans 忽略某个接口

--- #################### RPC 远程调用相关配置 ####################

--- #################### MQ 消息队列相关配置 ####################

--- #################### 定时任务相关配置 ####################

xxl:
  job:
    executor:
      appname: ${spring.application.name} # 执行器 AppName
      logpath: ${user.home}/logs/xxl-job/${spring.application.name} # 执行器运行日志文件存储磁盘路径
    accessToken: CHANGE_ME # 执行器通讯TOKEN

--- #################### 芋道相关配置 ####################

dichat:
  info:
    version: 1.0.0
    base-package: com.diqin.cloud.module.im
  web:
    admin-ui:
      url: http://dashboard.dichat.iocoder.cn # Admin 管理后台 UI 的地址
  xss:
    enable: false
    exclude-urls: # 如下 url，仅仅是为了演示，去掉配置也没关系
      - ${management.endpoints.web.base-path}/** # 不处理 Actuator 的请求
  swagger:
    title: 管理后台
    description: 提供管理员管理的所有功能
    version: ${dichat.info.version}
  tenant: # 多租户相关配置项
    enable: true
    ignore-urls:
    ignore-tables:
      - im_sensitive_word

  im: # IM 模块业务配置
    auth: # IM 独立账号 / 鉴权
      access-token-expire-in: 7200 # 秒；2 小时
      refresh-token-expire-in: 2592000 # 秒；30 天
      password-min-length: 6
      password-max-length: 32
    group:
      max-member: 500
      admin-max-count: 3
      pin-max-count: 5
    message:
      private-read-enabled: true
      group-read-enabled: true
      max-pull-size: 1000
      recall-timeout-minutes: 5
      private-pull-max-days: 30
      group-pull-max-days: 30
    robot: # IM 机器人 / 转人工配置（绑定 ImProperties.Robot）
      enable-auto-assign: true          # 转人工自动分配总开关；false 时转人工整体降级为兜底提示（不挑客服、不开会话）
      load-balance-window-minutes: 60   # 负载均衡活跃会话统计窗口（分钟）；近 N 分钟内不同对端私聊计入客服负载
      transfer-cooldown-minutes: 30     # 转人工去重冷却（分钟）；窗口内已转过人工则不再重复转接
    rtc:
      enabled: true
      livekit-url: ws://CHANGE_ME:7880
      api-key: CHANGE_ME
      api-secret: CHANGE_ME
      token-ttl-hours: 6
      group-max-participants: 16
      cleanup-zombie-threshold-minutes: 5
      invite-timeout-minutes: 1
    pay: # IM 社交支付配置（绑定 ImPayProperties，金额单位：分）
      single-transfer-limit: 200000      # 单笔转账限额 = 2000 元
      daily-transfer-limit: 2000000     # 每日转账限额 = 20000 元
      single-red-packet-limit: 200000    # 单笔红包限额 = 2000 元
      daily-red-packet-limit: 2000000   # 每日红包限额 = 20000 元
      red-packet-expire-minutes: 1440      # 红包 / 转账过期时间 = 24 小时
    file: # IM 文件上传配置（绑定 ImFileProperties，大小单位：字节，尺寸单位：像素）
      max-file-size: 10485760              # 单文件大小上限 = 10 MB
      default-thumb-size: 200             # 缩略图默认最大边长 = 200 px
      max-thumb-size: 1000                # 缩略图最大边长上限 = 1000 px，防止前端传入过大值
    slo: # IM 数据看板 SLO 指标目标值（绑定 SloProperties，单位随指标而异）
      message-reach-rate: 99.0           # 消息触达率目标，单位：%
      monthly-active-user: 50000.0       # 月活跃用户目标，单位：人
      realtime-call-concurrency: 200.0   # 实时通话并发目标，单位：路
      message-throughput: 100.0          # 消息吞吐目标，单位：条/秒

    push: # UniPush 离线推送配置（需要 DCloud 开发者中心注册应用获取）
      unipush:
        enabled: false                     # 默认关闭，开启需配置 app-id/app-key/app-secret/master-secret
        app-id: your-app-id
        app-key: your-app-key
        app-secret: your-app-secret
        master-secret: your-master-secret
        offline-message-expire-hours: 72   # 离线消息保留时长（小时）

    app-version: # 应用版本检测配置（供 /im/app/version/check 接口比对客户端版本）
      latest-version: 1.0.0                 # 最新发布版本号；客户端低于此值即提示更新
      force-below-version: ""               # 最低可运行版本号（强制更新阈值）；留空不强制
      android-download-url: ""              # Android 新版本 apk 下载地址
      ios-download-url: ""                  # iOS 新版本下载地址（App Store / TestFlight）
      download-url: ""                      # 通用下载地址（平台专属缺失时回退）
      description: 修复已知问题，优化消息收发起步速度   # 更新说明
      size: ""                              # 安装包大小，如 28.6 MB

debug: false
